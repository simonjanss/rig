            description: Returned whenever a request fails.
        ErrorCode:
            type: string
            enum:
                - BadRequest
                - Unauthorized
                - Forbidden
                - NotFound
                - Conflict
                - UnprocessableEntity
                - RateLimited
                - TooLarge
                - UnsupportedMediaType
                - UpgradeRequired
