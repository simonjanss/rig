                - $ref: '#/components/parameters/ApiRevision'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                description: The file to attach, as a multipart form.
                content:
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/ProfileUploadBannerFileMultipart'
                        encoding:
                            bannerFile:
                                contentType: application/octet-stream
                required: true
            responses:
                "201":
                    description: The stored file.
                    headers:
                        Idempotency-Replayed:
                            $ref: '#/components/headers/IdempotencyReplayed'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RigFile'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "413":
                    $ref: '#/components/responses/TooLarge'
                "415":
                    $ref: '#/components/responses/UnsupportedMediaType'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: profile.banner_file.write
        delete:
            tags:
                - Profiles
            summary: Remove a Profile's banner.
            description: |-
                The column is cleared and the file is retired. Its bytes outlive the delete for as long as the file restore window, because a restore inside that window has to hand back a row pointing at something.

                Requires the `profile.banner_file.write` permission.
            operationId: deleteProfileBannerFile
            parameters:
                - name: id
                  in: path
                  description: Identifier of the Profile.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "204":
                    description: The file was removed.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: profile.banner_file.write
