            type: object
            properties:
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/RigFile'
                    description: The rows in this page.
                pagination:
                    $ref: '#/components/schemas/Pagination'
                    description: Where this page sits in the full result set.
            description: A page of RigFiles.
        RigFileSearchBody:
            type: object
            properties:
                filter:
                    $ref: '#/components/schemas/RigFileFilter'
                    description: Conditions rows must satisfy.
            required:
                - filter
            description: The request body for RigFile.Search.
        RigFileUpdateInput:
            type: object
            properties:
                storageKey:
                    type: string
                    description: Where the bytes are, derived from the identifier and never from a name.
                url:
                    type: string
                    description: Where the file is served from. It is a column so a synced row carries it and a client can render the file without asking anything first.
                fileName:
                    type: string
                    description: What the file was called when it arrived.
                contentType:
                    type: string
                    description: What the bytes were sniffed to be, which is not what the client claimed.
                sizeBytes:
                    type: integer
                    format: int64
                    description: How large the object is.
                uploadedAt:
                    type:
                        - string
                        - "null"
                    format: date-time
                    description: When the bytes landed. Null means the row was inserted and the upload has not finished, which is what makes an abandoned upload reapable.
            description: 'The fields of a RigFile to change. Every member is optional: one left out is left alone, and an explicit null clears it.'
