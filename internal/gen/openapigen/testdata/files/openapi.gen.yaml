                    type: integer
                    format: int32
                    default: 0
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: A page of Profiles.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProfileListResponse'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: profile.read
        post:
            tags:
                - Profiles
            summary: Create a Profile.
            description: |-
                Create a Profile.

                Requires the `profile.write` permission.
            operationId: createProfile
            parameters:
                - $ref: '#/components/parameters/ApiRevision'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                description: The Profile to create, as JSON — or as a multipart form when its files are being attached in the same request.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProfileCreateInput'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/ProfileCreateMultipart'
                        encoding:
                            json:
                                contentType: application/json
                            profileImageFile:
                                contentType: application/octet-stream
                            bannerFile:
                                contentType: application/octet-stream
                required: true
            responses:
                "201":
                    description: The created Profile.
                    headers:
                        Idempotency-Replayed:
                            $ref: '#/components/headers/IdempotencyReplayed'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Profile'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "409":
                    $ref: '#/components/responses/Conflict'
                "413":
                    $ref: '#/components/responses/TooLarge'
                "415":
                    $ref: '#/components/responses/UnsupportedMediaType'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: profile.write
    /api/v1/profiles/_search:
        post:
            tags:
                - Profiles
            summary: Search Profiles with filters.
            description: |-
                Search Profiles with filters.

                The primary form of this operation is `QUERY /api/v1/profiles` — a read that carries a body, and so safe and idempotent in a way POST is not. OpenAPI 3.1 cannot describe an operation on the QUERY method, so it is documented here as the POST alias that exists for intermediaries which reject unfamiliar methods. One handler serves both routes and they answer identically.

