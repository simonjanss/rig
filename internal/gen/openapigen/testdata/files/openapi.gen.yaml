                  description: Rows to skip before the first returned row.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 0
                - $ref: '#/components/parameters/ApiRevision'
            requestBody:
                description: The request body for Profile.Search.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProfileSearchBody'
                required: true
            responses:
                "200":
                    description: A page of matching Profiles.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProfileListResponse'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
