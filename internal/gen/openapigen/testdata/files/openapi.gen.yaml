                documentFileId:
                    type: string
                    format: uuid
                    description: The same shape, deliberately left without an index so the rule has something to say. Before the tenant-carrying form was denormalized onto its column, it had nothing to say about either of these.
                thumbnailFileId:
                    type:
                        - string
                        - "null"
                    format: uuid
                    description: The control. Named like a file column and pointing at profile instead, so it is not one — and it still gets the ordinary naming advice.
                caption:
                    type:
                        - string
                        - "null"
                    description: What the attachment is.
