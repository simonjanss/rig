openapi: 3.1.0
info:
    title: demo
    description: The demo HTTP API.
    version: v1
servers:
    - url: https://api.example.com
      description: The production deployment of this API.
    - url: http://localhost:8080
      description: The local deployment of this API.
paths:
    /api/v1/profile-attachments:
        get:
            tags:
                - ProfileAttachments
            summary: List ProfileAttachments.
            description: |-
                List ProfileAttachments.

                Requires the `profile_attachment.read` permission.
            operationId: listProfileAttachments
            parameters:
                - name: limit
                  in: query
                  description: Maximum rows to return.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 50
                - name: offset
                  in: query
                  description: Rows to skip before the first returned row.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 0
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: A page of ProfileAttachments.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProfileAttachmentListResponse'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: profile_attachment.read
        post:
            tags:
                - ProfileAttachments
            summary: Create a ProfileAttachment.
            description: |-
                Create a ProfileAttachment.

                Requires the `profile_attachment.write` permission.
            operationId: createProfileAttachment
            parameters:
                - $ref: '#/components/parameters/ApiRevision'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                description: The ProfileAttachment to create, as JSON — or as a multipart form when its files are being attached in the same request.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProfileAttachmentCreateInput'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/ProfileAttachmentCreateMultipart'
                        encoding:
                            json:
                                contentType: application/json
                            documentFile:
                                contentType: application/octet-stream
                required: true
            responses:
                "201":
                    description: The created ProfileAttachment.
                    headers:
                        Idempotency-Replayed:
                            $ref: '#/components/headers/IdempotencyReplayed'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProfileAttachment'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "409":
                    $ref: '#/components/responses/Conflict'
                "413":
                    $ref: '#/components/responses/TooLarge'
                "415":
                    $ref: '#/components/responses/UnsupportedMediaType'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: profile_attachment.write
    /api/v1/profile-attachments/_search:
        post:
            tags:
                - ProfileAttachments
            summary: Search ProfileAttachments with filters.
            description: |-
                Search ProfileAttachments with filters.

                The primary form of this operation is `QUERY /api/v1/profile-attachments` — a read that carries a body, and so safe and idempotent in a way POST is not. OpenAPI 3.1 cannot describe an operation on the QUERY method, so it is documented here as the POST alias that exists for intermediaries which reject unfamiliar methods. One handler serves both routes and they answer identically.

                Requires the `profile_attachment.read` permission.
            operationId: searchProfileAttachments
            parameters:
                - name: limit
                  in: query
                  description: Maximum rows to return.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 50
                - name: offset
                  in: query
                  description: Rows to skip before the first returned row.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 0
                - $ref: '#/components/parameters/ApiRevision'
            requestBody:
                description: The request body for ProfileAttachment.Search.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProfileAttachmentSearchBody'
                required: true
            responses:
                "200":
                    description: A page of matching ProfileAttachments.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProfileAttachmentListResponse'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: profile_attachment.read
    /api/v1/profile-attachments/{id}:
        get:
            tags:
                - ProfileAttachments
            summary: Fetch one ProfileAttachment by identifier.
            description: |-
                Fetch one ProfileAttachment by identifier.

                Requires the `profile_attachment.read` permission.
            operationId: getProfileAttachment
            parameters:
                - name: id
                  in: path
                  description: Identifier of the ProfileAttachment.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: The requested ProfileAttachment.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProfileAttachment'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: profile_attachment.read
        delete:
            tags:
                - ProfileAttachments
            summary: Delete a ProfileAttachment.
            description: |-
                Delete a ProfileAttachment.

                Requires the `profile_attachment.delete` permission.
            operationId: deleteProfileAttachment
            parameters:
                - name: id
                  in: path
                  description: Identifier of the ProfileAttachment.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "204":
                    description: The ProfileAttachment was deleted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: profile_attachment.delete
        patch:
            tags:
                - ProfileAttachments
            summary: Update a ProfileAttachment.
            description: |-
                Only the fields present in the body are changed. A field set to null is cleared; a field left out is left alone.

                Requires the `profile_attachment.write` permission.
            operationId: updateProfileAttachment
            parameters:
                - name: id
                  in: path
                  description: Identifier of the ProfileAttachment.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                description: 'The fields of a ProfileAttachment to change. Every member is optional: one left out is left alone, and an explicit null clears it.'
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProfileAttachmentUpdateInput'
                required: true
            responses:
                "200":
                    description: The updated ProfileAttachment.
                    headers:
                        Idempotency-Replayed:
                            $ref: '#/components/headers/IdempotencyReplayed'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProfileAttachment'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: profile_attachment.write
    /api/v1/profile-attachments/{id}/document-file:
        post:
            tags:
                - ProfileAttachments
            summary: Attach a file to a ProfileAttachment as its document.
            description: |-
                The form carries one part, named documentFile. Nothing else in it is accepted.

                The type is sniffed from the bytes rather than taken from what the request claimed, and the sniffed type is what is stored and what a download announces. A file replacing an existing one does not delete it: a row that keeps its previous versions still points at the old file from every one of them.

                Requires the `profile_attachment.document_file.write` permission.
            operationId: uploadProfileAttachmentDocumentFile
            parameters:
                - name: id
                  in: path
                  description: Identifier of the ProfileAttachment.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                description: The file to attach, as a multipart form.
                content:
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/ProfileAttachmentUploadDocumentFileMultipart'
                        encoding:
                            documentFile:
                                contentType: application/octet-stream
                required: true
            responses:
                "201":
                    description: The stored file.
                    headers:
                        Idempotency-Replayed:
                            $ref: '#/components/headers/IdempotencyReplayed'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RigFile'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "413":
                    $ref: '#/components/responses/TooLarge'
                "415":
                    $ref: '#/components/responses/UnsupportedMediaType'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: profile_attachment.document_file.write
    /api/v1/profile-attachments/{id}/document-file/{fileId}/{filename}:
        get:
            tags:
                - ProfileAttachments
            summary: Fetch a ProfileAttachment's document.
            description: |-
                Answers range and conditional requests, so a resumed download does not start over and a media element can seek.

                Requires the `profile_attachment.document_file.read` permission.
            operationId: downloadProfileAttachmentDocumentFile
            parameters:
                - name: id
                  in: path
                  description: Identifier of the ProfileAttachment.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: fileId
                  in: path
                  description: Identifier of the file, from the row's document field.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: filename
                  in: path
                  description: The file's own name. It has to match the stored one, and it is what the browser offers to save the download as.
                  required: true
                  schema:
                    type: string
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: The file's bytes, announced as whatever they were sniffed to be.
                    content:
                        application/octet-stream: {}
                "206":
                    description: The requested range of the file.
                    content:
                        application/octet-stream: {}
                "304":
                    description: The caller already has this version of the file.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: profile_attachment.document_file.read
