tags:
    - name: Profiles
      description: Somebody's public face, with pictures attached to it.
    - name: ProfileAttachments
      description: A gallery is a table. Many files against one row is a child table with one file column, not a second mechanism.
    - name: RigFiles
      description: One uploaded file. Metadata only — the bytes live in the blob store, and the storage key never leaves the server.
