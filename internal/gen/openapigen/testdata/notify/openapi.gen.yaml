openapi: 3.1.0
info:
    title: demo
    description: |-
        The demo HTTP API.

        The authentication endpoints under `/auth` are served by a hand-written module and are not described here.

        The notification inbox endpoints are served by a hand-written module and are not described here.
    version: v1
servers:
    - url: https://api.example.test
paths:
    /api/v1/blog-posts:
        get:
            tags:
                - BlogPosts
            summary: List BlogPosts.
            description: |-
                List BlogPosts.

                Requires the `blog_post.read` permission.
            operationId: listBlogPosts
            parameters:
                - name: limit
                  in: query
                  description: Maximum rows to return.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 50
                - name: offset
                  in: query
                  description: Rows to skip before the first returned row.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 0
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: A page of BlogPosts.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BlogPostListResponse'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: blog_post.read
        post:
            tags:
                - BlogPosts
            summary: Create a BlogPost.
            description: |-
                Create a BlogPost.

                Requires the `blog_post.write` permission.
            operationId: createBlogPost
            parameters:
                - $ref: '#/components/parameters/ApiRevision'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                description: The fields a new BlogPost is created with. A field the database cannot supply for itself is required.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BlogPostCreateInput'
                required: true
            responses:
                "201":
                    description: The created BlogPost.
                    headers:
                        Idempotency-Replayed:
                            $ref: '#/components/headers/IdempotencyReplayed'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BlogPost'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: blog_post.write
    /api/v1/blog-posts/_deleted:
        get:
            tags:
                - BlogPosts
            summary: List retired BlogPosts.
            description: |-
                A deletion stamps the row rather than removing it, so this is what was deleted and can still be brought back. Only rows inside the 30-day restore window appear: past it a row is gone as far as anyone is concerned, so it is not in the trash either.

                Requires the `blog_post.read` permission.
            operationId: listDeletedBlogPosts
            parameters:
                - name: limit
                  in: query
                  description: Maximum rows to return.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 50
                - name: offset
                  in: query
                  description: Rows to skip before the first returned row.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 0
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: A page of retired BlogPosts.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BlogPostListResponse'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: blog_post.read
    /api/v1/blog-posts/_search:
        post:
            tags:
                - BlogPosts
            summary: Search BlogPosts with filters.
            description: |-
                Search BlogPosts with filters.

                The primary form of this operation is `QUERY /api/v1/blog-posts` — a read that carries a body, and so safe and idempotent in a way POST is not. OpenAPI 3.1 cannot describe an operation on the QUERY method, so it is documented here as the POST alias that exists for intermediaries which reject unfamiliar methods. One handler serves both routes and they answer identically.

                Requires the `blog_post.read` permission.
            operationId: searchBlogPosts
            parameters:
                - name: limit
                  in: query
                  description: Maximum rows to return.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 50
                - name: offset
                  in: query
                  description: Rows to skip before the first returned row.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 0
                - $ref: '#/components/parameters/ApiRevision'
            requestBody:
                description: The request body for BlogPost.Search.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BlogPostSearchBody'
                required: true
            responses:
                "200":
                    description: A page of matching BlogPosts.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BlogPostListResponse'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: blog_post.read
    /api/v1/blog-posts/{id}:
        get:
            tags:
                - BlogPosts
            summary: Fetch one BlogPost by identifier.
            description: |-
                Fetch one BlogPost by identifier.

                Requires the `blog_post.read` permission.
            operationId: getBlogPost
            parameters:
                - name: id
                  in: path
                  description: Identifier of the BlogPost.
                  required: true
                  schema:
                    type: string
                    format: uuid
