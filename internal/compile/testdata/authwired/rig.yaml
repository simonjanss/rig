project:
  name: authwired
  module: example.com/authwired

# Three deployments, with the default marked on an entry that is not the first —
# so the golden proves the marker is read rather than the position, and proves
# the OpenAPI document hoists the marked one to the front where a viewer's trial
# request goes.
servers:
  - name: local
    url: http://localhost:8080
    description: A machine on somebody's desk.
  - name: production
    url: https://api.example.com
    description: The deployment your customers reach.
    default: true
  - name: staging_eu
    url: https://staging.eu.example.com

# A browser front end on a different host of the same registrable domain, which
# is the deployment the handoff cookie exists for: both origin and origin_env are
# set, so the golden proves the environment wins and the file is the default, and
# the callback path is not the default so the golden proves it is read.
web:
  origin: https://console.example.com
  origin_env: APP_ORIGIN
  callback_path: /auth/finish
  cors:
    allowed_origins: [https://admin.example.com, "https://*.example.com"]
    max_age: 5m

# Everything the auth block can say, so the compiled document carries every field
# and the generator's golden output exercises every branch. A real project sets a
# handful of these and inherits the rest.
auth:
  enabled: true
  base_path: /auth

  # A tenant per subdomain, with the application's own resolver behind it. The
  # host is the only source that survives a provider redirect.
  tenant:
    from: [host, header, hook]
    header: X-Tenant-Id
    default_slug_env: DEFAULT_TENANT

  session:
    access_ttl: 5m
    refresh_ttl: 8h
    remember_ttl: 14d
    rotation_leeway: 45s
    identity_ttl: 20m

  email_code:
    enabled: true
    length: 8
    ttl: 15m
    max_attempts: 3
    allow_provisioning: true

  allow_tenant_creation: true
  require_verified_email: true

  # Who may become a person here at all, which is not the same question as a
  # tenant's own allowed_email_domains: that one is about holding an account in
  # one tenant, and an ordinary sign-in names no tenant to read it from. An
  # invitation is allowed whatever this says.
  allowed_identity_domains: [example.com, example.org]

  limits:
    login_by_email: {max: 3, window: 10m}
    login_by_ip: {max: 40, window: 15m}
    email_code_request: {max: 2, window: 1h}
    email_code_ip: {max: 12, window: 1h}
    invitation_preview: {max: 30, window: 1h}
    refresh: {max: 30, window: 1m}

  trusted_proxies: [10.0.0.0/8, 192.168.0.0/16]

  # Comfortably above the longest limit window above, which is what the
  # configuration check insists on: the limits are counted from rig_auth_log, so
  # a shorter window would prune away the failures a lockout adds up to.
  log_retention: 90d

  oauth:
    base_url: https://app.example.com
    base_url_env: BASE_URL
    origin_from_host: true
    signing_key_env: OAUTH_SIGNING_KEY
    state_ttl: 8m
    allow_provisioning: true
    # Set apart from allow_provisioning, so the two doors and the generated
    # pointer are both covered: a provider may create a person here and may not
    # put one in a tenant.
    allow_joining: false
    allowed_return_to: [https://app.example.com, https://beta.example.com]
    providers:
      - name: google
        required: true
      - name: microsoft
        tenant_env: WORK_DIRECTORY
      - name: github
        client_id_env: GH_APP_ID
        client_secret_env: GH_APP_SECRET

# The reads rig makes on behalf of every caller — verifying a session, verifying
# an API key — held in memory and withdrawn over a Postgres channel when the
# transaction that revoked something commits. The lifetime is the backstop and
# not the guarantee, which is why there is one number here rather than one under
# `auth:` that meant something weaker.
cache:
  enabled: true
  ttl: 45s
  channel: rig_cache_authwired
  max_entries: 25000
