project:
  name: demo
  module: example.com/demo

# The two rules this fixture exists to exercise, both turned up so a regression
# is a failure rather than a warning nobody reads.
#
# fk_naming has to stay quiet about a <role>_file_id column and keep speaking
# about everything else. fk_needs_index has to see a composite key at all —
# before the tenant-carrying form was denormalized onto its column, it saw
# nothing there to check.
validate:
  fk_naming: error
  fk_needs_index: error
  missing_comment: warn
