# yaml-language-server: $schema=.rig/rig.schema.json
version: 1

project:
  name: todo
  module: github.com/simonjanss/rig/examples/todo

api:
  version: v1
  # No authorization at all in this example, so no checks are generated. The
  # default is `derived`, which gives every endpoint a permission taken from its
  # resource and operation and refuses a caller who does not hold it — right for
  # an application with accounts, and noise for one whose claims are a fixed
  # stand-in. See examples/auth for the other half.
  permissions: none
  base_path: /api/v1

# A throwaway Postgres, created on demand. The port is explicit so this example
# can run alongside another rig project without fighting over the default.
database:
  image: postgres:17-alpine
  port: 55440

# Uploads. `enabled` is what makes server-go write the wiring at all, and a
# project without this block carries no blob store and no multipart reader.
#
# The backend is memory because this example is a `go run .` and a throwaway
# database: uploads do not survive a restart, which is exactly right here and
# exactly wrong in production. `expose` is off, so rig_file stays managed and
# the file's URL is read from the response to an upload rather than synced off
# a row — the todo example has no live sync to read it with.
files:
  enabled: true
  backend: memory
  # Small on purpose, so the demonstration can show a refusal without asking
  # anybody to produce a 25 MiB file.
  max_bytes: 5242880

# The inbox, in an example with no authentication at all — which is the half of
# the story examples/auth cannot tell. What a notification needs is an account to
# be addressed to; where the claims naming that account come from is not this
# block's business, and here they come from a header.
notifications:
  enabled: true

# Every table gets a configuration file. `rig sync` creates and updates them.
layout:
  table_dir: services/{table}
  config_file: "{table_dir}/{table}.yaml"

# Convention rules. Each is off, warn, or error.
validate:
  unmentioned_column: warn
  missing_comment: error
  fk_needs_index: error
  tenant_id_leading_index: error
  boolean_prefix: warn

generators:
  # The entity, its enums, its query types, and its inputs. Both of the
  # layers below import this one, so there is one definition of a row
  # rather than a copy on each side and a conversion between them.
  - name: model-go
    out_dir: internal/model
    options:
      package: model

  # The repository interface and its pgx implementation.
  - name: persist-go
    out_dir: internal/store
    options:
      package: store
      model_import: github.com/simonjanss/rig/examples/todo/internal/model

  # Wire types, the interface your service layer implements, and a
  # working default implementation of every operation.
  - name: service-go
    out_dir: internal/api
    options:
      package: api
      model_import: github.com/simonjanss/rig/examples/todo/internal/model
      store_import: github.com/simonjanss/rig/examples/todo/internal/store
      api_import: github.com/simonjanss/rig/examples/todo/internal/api
      # Where your service layer goes. Written once, then yours.
      stub_dir: services/{table}

  # Routing and handlers.
  - name: server-go
    out_dir: internal/api
    options:
      package: api
      model_import: github.com/simonjanss/rig/examples/todo/internal/model

  # A typed Go client for this API: the wire types, and one method per
  # endpoint. It is generated from the same document the router is, so
  # the two cannot disagree about a path or the name of a key.
  #
  # Not internal/, deliberately: a client is for somebody else's program,
  # and Go's internal rule would keep it out of exactly the code that
  # wants it. See examples/sdk.
  - name: go-client
    out_dir: client
    options:
      package: client
      # Where this example runs, so a demo can build a client without
      # naming the server. A real project leaves it out.
      default_base_url: http://localhost:8080

  # The same client for a browser, from the same document. Two packages
  # underneath it rather than one: @rig/client is the request, the
  # credential and the failure and has no dependencies, and @rig/electric
  # is the live-sync collections and brings TanStack DB with it. A project
  # with no streamed table never gets the second file and never installs
  # the second package.
  #
  # client-ts rather than web/src/api: this example's web/ is a Go
  # server-rendered UI, and the generated client is for somebody else's
  # front end the same way client/ is for somebody else's program.
  - name: ts-client
    out_dir: client-ts
    options:
      default_base_url: http://localhost:8080

  # Live-sync shape endpoints. It writes nothing until a table asks
  # for one with `electric: {enabled: true}`, so leaving it here costs
  # nothing and turning it on is one line in a table's configuration.
  - name: electric
    out_dir: internal/electric
    options:
      package: electric
      electric_url: http://localhost:3000
      shape_import: github.com/simonjanss/rig/examples/todo/internal/electric
      # Where your extra scoping goes. Written once, then yours.
      stub_dir: services/{table}
