        IdempotencyKey:
            name: Idempotency-Key
            in: header
            description: A key of the caller's choosing, so a retried write happens once. Sending the same key with the same body replays the first answer and sets Idempotency-Replayed; with a different body it is refused with 422, and while the first is still in flight, with 409.
