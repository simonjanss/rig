    /api/v1/todos/{id}/cover-file/{fileId}/{filename}:
        get:
            tags:
                - Todos
            summary: Fetch a Todo's cover.
            description: Answers range and conditional requests, so a resumed download does not start over and a media element can seek.
            operationId: downloadTodoCoverFile
            parameters:
                - name: id
                  in: path
                  description: Identifier of the Todo.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: fileId
                  in: path
                  description: Identifier of the file, from the row's cover field.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: filename
                  in: path
                  description: The file's own name. It has to match the stored one, and it is what the browser offers to save the download as.
                  required: true
                  schema:
                    type: string
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: The file's bytes, announced as whatever they were sniffed to be.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                    content:
                        application/octet-stream: {}
                "206":
                    description: The requested range of the file.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                    content:
                        application/octet-stream: {}
                "304":
                    description: The caller already has this version of the file.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
