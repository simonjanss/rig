        delete:
            tags:
                - Todos
            summary: Remove a Todo's cover.
            description: The column is cleared and the file is retired. Its bytes outlive the delete for as long as the file restore window, because a restore inside that window has to hand back a row pointing at something.
            operationId: deleteTodoCoverFile
            parameters:
                - name: id
                  in: path
                  description: Identifier of the Todo.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "204":
                    description: The file was removed.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
