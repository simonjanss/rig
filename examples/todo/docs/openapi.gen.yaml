openapi: 3.1.0
info:
    title: todo
    description: |-
        The todo HTTP API.

        The notification inbox endpoints are served by a hand-written module and are not described here.
    version: "2026-08-30"
servers:
    - url: http://localhost:8080
      description: This example, running on your machine.
paths:
    /api/v1/rig_notification_recipient/_deleted/_stream:
        get:
            tags:
                - NotificationRecipients
            summary: Subscribe to retired NotificationRecipients.
            description: |-
                The rows a delete stamped rather than removed, kept up to date.

                A shape is a filtered view of one table that a client subscribes to. This route is a proxy in front of the sync service: which rows exist in the shape — the tenant, the lifecycle predicate, and the application's own scoping — is decided by the server and cannot be influenced from here. Where the client is in the stream is forwarded untouched.

                With `live=true` the request is a long poll: it does not answer until something changes, so a client timeout set for an ordinary request will cut it short.

                The response body is the sync protocol's own and is not described here. The `electric-*` response headers carry the cursor: send `handle` and `offset` back on the next request, or the subscription starts over.

                Requires a session scoped to a tenant, and the shape is filtered to it.
            operationId: streamDeletedNotificationRecipients
            parameters:
                - name: offset
                  in: query
                  description: Where in the stream to resume, from the previous response's electric-offset.
                  required: false
                  schema:
                    type: string
                - name: handle
                  in: query
                  description: The shape handle from a previous response. Omit it to start a new subscription.
                  required: false
                  schema:
                    type: string
                - name: live
                  in: query
                  description: Long-poll until something changes, rather than answering with what is there now.
                  required: false
                  schema:
                    type: boolean
                - name: cursor
                  in: query
                  description: The sync service's own cache-busting cursor, echoed back from the last response.
                  required: false
                  schema:
                    type: string
                - name: replica
                  in: query
                  description: Whether updates carry the whole row or only the columns that changed.
                  required: false
                  schema:
                    type: string
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: A chunk of the shape, in the sync protocol's own format.
                    headers:
                        electric-handle:
                            description: The shape handle. Send it back to continue this subscription.
                            schema:
                                type: string
                        electric-offset:
                            description: Where this chunk ended. Send it back to resume from here.
                            schema:
                                type: string
                        electric-schema:
                            description: The shape's column types.
                            schema:
                                type: string
                        electric-cursor:
                            description: The cursor to echo on the next request.
                            schema:
                                type: string
                        electric-up-to-date:
                            description: Present when the client has caught up with the shape.
                            schema:
                                type: string
                        X-Rig-Sync-Fallback:
                            description: Present when this response is a snapshot served because the sync service could not be reached, rather than a chunk of a live subscription. The rows are correct as of the moment they were read and are not updated until the subscription resumes.
                            schema:
                                type: string
                    content:
                        application/json: {}
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "502":
                    description: 'The sync service could not be reached, and this shape had nothing to answer with instead: no database was configured, this shape asked not to be answered from one, or the read failed or was larger than a snapshot may be.'
                    content:
                        text/plain: {}
                "503":
                    description: The sync service could not be reached, and this subscription already holds a snapshot. Keep it and retry after Retry-After.
                    headers:
                        Retry-After:
                            description: Seconds to wait before polling again.
                            schema:
                                type: integer
                    content:
                        text/plain: {}
    /api/v1/rig_notification_recipient/_stream:
        get:
            tags:
                - NotificationRecipients
            summary: Subscribe to the live NotificationRecipient shape.
            description: |-
                Every NotificationRecipient the caller may read, kept up to date.

                A shape is a filtered view of one table that a client subscribes to. This route is a proxy in front of the sync service: which rows exist in the shape — the tenant, the lifecycle predicate, and the application's own scoping — is decided by the server and cannot be influenced from here. Where the client is in the stream is forwarded untouched.

                With `live=true` the request is a long poll: it does not answer until something changes, so a client timeout set for an ordinary request will cut it short.

                The response body is the sync protocol's own and is not described here. The `electric-*` response headers carry the cursor: send `handle` and `offset` back on the next request, or the subscription starts over.

                Requires a session scoped to a tenant, and the shape is filtered to it.
            operationId: streamNotificationRecipients
            parameters:
                - name: offset
                  in: query
                  description: Where in the stream to resume, from the previous response's electric-offset.
                  required: false
                  schema:
                    type: string
                - name: handle
                  in: query
                  description: The shape handle from a previous response. Omit it to start a new subscription.
                  required: false
                  schema:
                    type: string
                - name: live
                  in: query
                  description: Long-poll until something changes, rather than answering with what is there now.
                  required: false
                  schema:
                    type: boolean
                - name: cursor
                  in: query
                  description: The sync service's own cache-busting cursor, echoed back from the last response.
                  required: false
                  schema:
                    type: string
                - name: replica
                  in: query
                  description: Whether updates carry the whole row or only the columns that changed.
                  required: false
                  schema:
                    type: string
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: A chunk of the shape, in the sync protocol's own format.
                    headers:
                        electric-handle:
                            description: The shape handle. Send it back to continue this subscription.
                            schema:
                                type: string
                        electric-offset:
                            description: Where this chunk ended. Send it back to resume from here.
                            schema:
                                type: string
                        electric-schema:
                            description: The shape's column types.
                            schema:
                                type: string
                        electric-cursor:
                            description: The cursor to echo on the next request.
                            schema:
                                type: string
                        electric-up-to-date:
                            description: Present when the client has caught up with the shape.
                            schema:
                                type: string
                        X-Rig-Sync-Fallback:
                            description: Present when this response is a snapshot served because the sync service could not be reached, rather than a chunk of a live subscription. The rows are correct as of the moment they were read and are not updated until the subscription resumes.
                            schema:
                                type: string
                    content:
                        application/json: {}
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "502":
                    description: 'The sync service could not be reached, and this shape had nothing to answer with instead: no database was configured, this shape asked not to be answered from one, or the read failed or was larger than a snapshot may be.'
                    content:
                        text/plain: {}
                "503":
                    description: The sync service could not be reached, and this subscription already holds a snapshot. Keep it and retry after Retry-After.
                    headers:
                        Retry-After:
                            description: Seconds to wait before polling again.
                            schema:
                                type: integer
                    content:
                        text/plain: {}
    /api/v1/todo-attachments:
        get:
            tags:
                - TodoAttachments
            summary: List TodoAttachments.
            description: List TodoAttachments.
            operationId: listTodoAttachments
            parameters:
                - name: limit
                  in: query
                  description: Maximum rows to return.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 50
                - name: offset
                  in: query
                  description: Rows to skip before the first returned row.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 0
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: A page of TodoAttachments.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TodoAttachmentListResponse'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
        post:
            tags:
                - TodoAttachments
            summary: Create a TodoAttachment.
            description: Create a TodoAttachment.
            operationId: createTodoAttachment
            parameters:
                - $ref: '#/components/parameters/ApiRevision'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                description: The TodoAttachment to create, as JSON — or as a multipart form when its files are being attached in the same request.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TodoAttachmentCreateInput'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/TodoAttachmentCreateMultipart'
                        encoding:
                            json:
                                contentType: application/json
                            attachmentFile:
                                contentType: application/octet-stream
                required: true
            responses:
                "201":
                    description: The created TodoAttachment.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                        Idempotency-Replayed:
                            $ref: '#/components/headers/IdempotencyReplayed'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TodoAttachment'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "409":
                    $ref: '#/components/responses/Conflict'
                "413":
                    $ref: '#/components/responses/TooLarge'
                "415":
                    $ref: '#/components/responses/UnsupportedMediaType'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
    /api/v1/todo-attachments/_deleted:
        get:
            tags:
                - TodoAttachments
            summary: List retired TodoAttachments.
            description: 'A deletion stamps the row rather than removing it, so this is what was deleted and can still be brought back. Only rows inside the 30-day restore window appear: past it a row is gone as far as anyone is concerned, so it is not in the trash either.'
            operationId: listDeletedTodoAttachments
            parameters:
                - name: limit
                  in: query
                  description: Maximum rows to return.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 50
                - name: offset
                  in: query
                  description: Rows to skip before the first returned row.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 0
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: A page of retired TodoAttachments.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TodoAttachmentListResponse'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
    /api/v1/todo-attachments/_search:
        post:
            tags:
                - TodoAttachments
            summary: Search TodoAttachments with filters.
            description: |-
                Search TodoAttachments with filters.

                The primary form of this operation is `QUERY /api/v1/todo-attachments` — a read that carries a body, and so safe and idempotent in a way POST is not. OpenAPI 3.1 cannot describe an operation on the QUERY method, so it is documented here as the POST alias that exists for intermediaries which reject unfamiliar methods. One handler serves both routes and they answer identically.
            operationId: searchTodoAttachments
            parameters:
                - name: limit
                  in: query
                  description: Maximum rows to return.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 50
                - name: offset
                  in: query
                  description: Rows to skip before the first returned row.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 0
                - $ref: '#/components/parameters/ApiRevision'
            requestBody:
                description: The request body for TodoAttachment.Search.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TodoAttachmentSearchBody'
                required: true
            responses:
                "200":
                    description: A page of matching TodoAttachments.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TodoAttachmentListResponse'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
    /api/v1/todo-attachments/{id}:
        get:
            tags:
                - TodoAttachments
            summary: Fetch one TodoAttachment by identifier.
            description: Fetch one TodoAttachment by identifier.
            operationId: getTodoAttachment
            parameters:
                - name: id
                  in: path
                  description: Identifier of the TodoAttachment.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: The requested TodoAttachment.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TodoAttachment'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
        delete:
            tags:
                - TodoAttachments
            summary: Delete a TodoAttachment.
            description: The row is retired by stamping a deletion time; it stops appearing in reads but can be restored within the retention window.
            operationId: deleteTodoAttachment
            parameters:
                - name: id
                  in: path
                  description: Identifier of the TodoAttachment.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "204":
                    description: The TodoAttachment was deleted.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
        patch:
            tags:
                - TodoAttachments
            summary: Update a TodoAttachment.
            description: Only the fields present in the body are changed. A field set to null is cleared; a field left out is left alone.
            operationId: updateTodoAttachment
            parameters:
                - name: id
                  in: path
                  description: Identifier of the TodoAttachment.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                description: 'The fields of a TodoAttachment to change. Every member is optional: one left out is left alone, and an explicit null clears it.'
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TodoAttachmentUpdateInput'
                required: true
            responses:
                "200":
                    description: The updated TodoAttachment.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                        Idempotency-Replayed:
                            $ref: '#/components/headers/IdempotencyReplayed'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TodoAttachment'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
    /api/v1/todo-attachments/{id}/_restore:
        post:
            tags:
                - TodoAttachments
            summary: Bring a retired TodoAttachment back.
            description: |-
                The deletion stamp is cleared and the row appears in reads again. It works for 30 days after the deletion; past that the row is no longer eligible and this answers 409.

                Restoring a row that was never deleted is not an error. It is already in the state the caller asked for, and answering otherwise would make a retry of a request whose response went missing look like a failure.

                The request carries no fields. What to do when the world has moved on while the row was retired — a unique value taken by something created since — is the application's decision, and it is made in the restore hook: refuse, or change the row so that it fits.

                Every rule then runs against whatever the hook settled on, not only the ones for fields it touched. The row was not live, so nothing about it has been checked against the world it is returning to.
            operationId: restoreTodoAttachment
            parameters:
                - name: id
                  in: path
                  description: Identifier of the TodoAttachment.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
                - $ref: '#/components/parameters/IdempotencyKey'
            responses:
                "200":
                    description: The restored TodoAttachment.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                        Idempotency-Replayed:
                            $ref: '#/components/headers/IdempotencyReplayed'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TodoAttachment'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
    /api/v1/todo-attachments/{id}/attachment-file:
        post:
            tags:
                - TodoAttachments
            summary: Attach a file to a TodoAttachment as its attachment.
            description: |-
                The form carries one part, named attachmentFile. Nothing else in it is accepted.

                The type is sniffed from the bytes rather than taken from what the request claimed, and the sniffed type is what is stored and what a download announces. A file replacing an existing one does not delete it: a row that keeps its previous versions still points at the old file from every one of them.
            operationId: uploadTodoAttachmentAttachmentFile
            parameters:
                - name: id
                  in: path
                  description: Identifier of the TodoAttachment.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                description: The file to attach, as a multipart form.
                content:
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/TodoAttachmentUploadAttachmentFileMultipart'
                        encoding:
                            attachmentFile:
                                contentType: application/octet-stream
                required: true
            responses:
                "201":
                    description: The stored file.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                        Idempotency-Replayed:
                            $ref: '#/components/headers/IdempotencyReplayed'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RigFile'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "413":
                    $ref: '#/components/responses/TooLarge'
                "415":
                    $ref: '#/components/responses/UnsupportedMediaType'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
    /api/v1/todo-attachments/{id}/attachment-file/{fileId}/{filename}:
        get:
            tags:
                - TodoAttachments
            summary: Fetch a TodoAttachment's attachment.
            description: Answers range and conditional requests, so a resumed download does not start over and a media element can seek.
            operationId: downloadTodoAttachmentAttachmentFile
            parameters:
                - name: id
                  in: path
                  description: Identifier of the TodoAttachment.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: fileId
                  in: path
                  description: Identifier of the file, from the row's attachment field.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: filename
                  in: path
                  description: The file's own name. It has to match the stored one, and it is what the browser offers to save the download as.
                  required: true
                  schema:
                    type: string
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: The file's bytes, announced as whatever they were sniffed to be.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                    content:
                        application/octet-stream: {}
                "206":
                    description: The requested range of the file.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                    content:
                        application/octet-stream: {}
                "304":
                    description: The caller already has this version of the file.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
    /api/v1/todo/_deleted/_stream:
