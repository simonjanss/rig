openapi: 3.1.0
info:
    title: auth_oauth
    description: |-
        The auth_oauth HTTP API.

        The authentication endpoints under `/auth` are served by a hand-written module and are not described here.
    version: "2026-08-30"
servers:
    - url: /
      description: This server. Set openapi.servers to name the deployment instead.
paths:
    /api/v1/bookmarks:
        get:
            tags:
                - Bookmarks
            summary: List Bookmarks.
            description: List Bookmarks.
            operationId: listBookmarks
            parameters:
                - name: limit
                  in: query
                  description: Maximum rows to return.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 50
                - name: offset
                  in: query
                  description: Rows to skip before the first returned row.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 0
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: A page of Bookmarks.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BookmarkListResponse'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
        post:
            tags:
                - Bookmarks
            summary: Create a Bookmark.
            description: Create a Bookmark.
            operationId: createBookmark
            parameters:
                - $ref: '#/components/parameters/ApiRevision'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                description: The fields a new Bookmark is created with. A field the database cannot supply for itself is required.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BookmarkCreateInput'
                required: true
            responses:
                "201":
                    description: The created Bookmark.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                        Idempotency-Replayed:
                            $ref: '#/components/headers/IdempotencyReplayed'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Bookmark'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
    /api/v1/bookmarks/_search:
        post:
            tags:
                - Bookmarks
            summary: Search Bookmarks with filters.
            description: |-
                Search Bookmarks with filters.

                The primary form of this operation is `QUERY /api/v1/bookmarks` — a read that carries a body, and so safe and idempotent in a way POST is not. OpenAPI 3.1 cannot describe an operation on the QUERY method, so it is documented here as the POST alias that exists for intermediaries which reject unfamiliar methods. One handler serves both routes and they answer identically.
            operationId: searchBookmarks
            parameters:
                - name: limit
                  in: query
                  description: Maximum rows to return.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 50
                - name: offset
                  in: query
                  description: Rows to skip before the first returned row.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 0
                - $ref: '#/components/parameters/ApiRevision'
            requestBody:
                description: The request body for Bookmark.Search.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BookmarkSearchBody'
                required: true
            responses:
                "200":
                    description: A page of matching Bookmarks.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BookmarkListResponse'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
    /api/v1/bookmarks/{id}:
        get:
            tags:
                - Bookmarks
            summary: Fetch one Bookmark by identifier.
            description: Fetch one Bookmark by identifier.
            operationId: getBookmark
            parameters:
                - name: id
                  in: path
                  description: Identifier of the Bookmark.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: The requested Bookmark.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Bookmark'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
        delete:
            tags:
                - Bookmarks
            summary: Delete a Bookmark.
            description: Delete a Bookmark.
            operationId: deleteBookmark
            parameters:
                - name: id
                  in: path
                  description: Identifier of the Bookmark.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "204":
                    description: The Bookmark was deleted.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
        patch:
            tags:
                - Bookmarks
            summary: Update a Bookmark.
            description: Only the fields present in the body are changed. A field set to null is cleared; a field left out is left alone.
            operationId: updateBookmark
            parameters:
                - name: id
                  in: path
                  description: Identifier of the Bookmark.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                description: 'The fields of a Bookmark to change. Every member is optional: one left out is left alone, and an explicit null clears it.'
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BookmarkUpdateInput'
                required: true
            responses:
                "200":
                    description: The updated Bookmark.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                        Idempotency-Replayed:
                            $ref: '#/components/headers/IdempotencyReplayed'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Bookmark'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
components:
    schemas:
        Bookmark:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                    description: Unique identifier for this row.
                    readOnly: true
                tenantId:
                    type: string
                    format: uuid
                    description: Tenant this row belongs to. Every query is scoped by it.
                    readOnly: true
                title:
                    type: string
                    description: What to call it in a list.
                url:
                    type: string
                    description: Where it points.
                createdAt:
                    type: string
                    format: date-time
                    description: When this row was created. Set automatically and never changes.
                    readOnly: true
                createdByAccountId:
                    type:
                        - string
                        - "null"
                    format: uuid
                    description: Account that created this row, taken from the request's claims.
                    readOnly: true
                updatedAt:
                    type:
                        - string
                        - "null"
                    format: date-time
                    description: When this row was last updated. Set automatically on every update.
                    readOnly: true
                updatedByAccountId:
                    type:
                        - string
                        - "null"
                    format: uuid
                    description: Account that last updated this row, taken from the request's claims.
                    readOnly: true
            description: A link somebody saved.
        BookmarkCreateInput:
            type: object
            properties:
                title:
                    type: string
                    description: What to call it in a list.
                url:
                    type: string
                    description: Where it points.
            required:
                - title
                - url
            description: The fields a new Bookmark is created with. A field the database cannot supply for itself is required.
        BookmarkFilter:
            type: object
            properties:
                equals:
                    oneOf:
                        - $ref: '#/components/schemas/BookmarkFilterEquals'
                        - type: "null"
                    description: Fields that must equal the given value.
                notEquals:
                    oneOf:
                        - $ref: '#/components/schemas/BookmarkFilterEquals'
                        - type: "null"
                    description: Fields that must not equal the given value.
                greaterThan:
                    oneOf:
                        - $ref: '#/components/schemas/BookmarkFilterRange'
                        - type: "null"
                    description: Fields that must be greater than the given value.
                smallerThan:
                    oneOf:
                        - $ref: '#/components/schemas/BookmarkFilterRange'
                        - type: "null"
                    description: Fields that must be less than the given value.
                greaterOrEqual:
                    oneOf:
                        - $ref: '#/components/schemas/BookmarkFilterRange'
                        - type: "null"
                    description: Fields that must be greater than or equal to the given value.
                smallerOrEqual:
                    oneOf:
                        - $ref: '#/components/schemas/BookmarkFilterRange'
                        - type: "null"
                    description: Fields that must be less than or equal to the given value.
                contains:
                    oneOf:
                        - $ref: '#/components/schemas/BookmarkFilterContains'
                        - type: "null"
                    description: Fields that must be one of the given values.
                notContains:
                    oneOf:
                        - $ref: '#/components/schemas/BookmarkFilterContains'
                        - type: "null"
                    description: Fields that must not be one of the given values.
                like:
                    oneOf:
                        - $ref: '#/components/schemas/BookmarkFilterLike'
                        - type: "null"
                    description: Text fields that must match the given pattern.
                notLike:
                    oneOf:
                        - $ref: '#/components/schemas/BookmarkFilterLike'
                        - type: "null"
                    description: Text fields that must not match the given pattern.
                "null":
                    oneOf:
                        - $ref: '#/components/schemas/BookmarkFilterNull'
                        - type: "null"
                    description: Fields that must be null.
                notNull:
                    oneOf:
                        - $ref: '#/components/schemas/BookmarkFilterNull'
                        - type: "null"
                    description: Fields that must not be null.
                orCondition:
                    type: boolean
                    description: Combine this filter's conditions with OR instead of AND.
                nestedFilters:
                    type: array
                    items:
                        $ref: '#/components/schemas/BookmarkFilter'
                    description: Sub-filters combined with this one, so that AND and OR can be mixed to any depth.
            description: Conditions a Bookmark must satisfy to match a search.
        BookmarkFilterContains:
            type: object
            properties:
                id:
                    type: array
                    items:
                        type: string
                        format: uuid
                    description: Unique identifier for this row.
                title:
                    type: array
                    items:
                        type: string
                    description: What to call it in a list.
                url:
                    type: array
                    items:
                        type: string
                    description: Where it points.
                createdAt:
                    type: array
                    items:
                        type: string
                        format: date-time
                    description: When this row was created. Set automatically and never changes.
                createdByAccountId:
                    type: array
                    items:
                        type: string
                        format: uuid
                    description: Account that created this row, taken from the request's claims.
                updatedAt:
                    type: array
                    items:
                        type: string
                        format: date-time
                    description: When this row was last updated. Set automatically on every update.
                updatedByAccountId:
                    type: array
                    items:
                        type: string
                        format: uuid
                    description: Account that last updated this row, taken from the request's claims.
            description: Set-membership conditions on Bookmark fields.
        BookmarkFilterEquals:
            type: object
            properties:
                id:
                    type:
                        - string
                        - "null"
                    format: uuid
                    description: Unique identifier for this row.
                title:
                    type:
                        - string
                        - "null"
                    description: What to call it in a list.
                url:
                    type:
                        - string
                        - "null"
                    description: Where it points.
                createdAt:
                    type:
                        - string
                        - "null"
                    format: date-time
                    description: When this row was created. Set automatically and never changes.
                createdByAccountId:
                    type:
                        - string
                        - "null"
                    format: uuid
                    description: Account that created this row, taken from the request's claims.
                updatedAt:
                    type:
                        - string
                        - "null"
                    format: date-time
                    description: When this row was last updated. Set automatically on every update.
                updatedByAccountId:
                    type:
                        - string
                        - "null"
                    format: uuid
                    description: Account that last updated this row, taken from the request's claims.
            description: Exact-match conditions on Bookmark fields.
        BookmarkFilterLike:
            type: object
            properties:
                title:
                    type:
                        - string
                        - "null"
                    description: What to call it in a list.
                url:
                    type:
                        - string
                        - "null"
                    description: Where it points.
            description: Pattern conditions on Bookmark text fields.
        BookmarkFilterNull:
            type: object
            properties:
                createdByAccountId:
                    type:
                        - boolean
                        - "null"
                    description: Account that created this row, taken from the request's claims.
                updatedAt:
                    type:
                        - boolean
                        - "null"
                    description: When this row was last updated. Set automatically on every update.
                updatedByAccountId:
                    type:
                        - boolean
                        - "null"
                    description: Account that last updated this row, taken from the request's claims.
            description: Presence conditions on nullable Bookmark fields.
        BookmarkFilterRange:
            type: object
            properties:
                createdAt:
                    type:
                        - string
                        - "null"
                    format: date-time
                    description: When this row was created. Set automatically and never changes.
                updatedAt:
                    type:
                        - string
                        - "null"
                    format: date-time
                    description: When this row was last updated. Set automatically on every update.
            description: Ordering conditions on Bookmark fields that can be compared.
        BookmarkListResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/Bookmark'
                    description: The rows in this page.
                pagination:
                    $ref: '#/components/schemas/Pagination'
                    description: Where this page sits in the full result set.
            description: A page of Bookmarks.
        BookmarkSearchBody:
            type: object
            properties:
                filter:
                    $ref: '#/components/schemas/BookmarkFilter'
                    description: Conditions rows must satisfy.
            required:
                - filter
            description: The request body for Bookmark.Search.
        BookmarkUpdateInput:
            type: object
            properties:
                title:
                    type: string
                    description: What to call it in a list.
                url:
                    type: string
                    description: Where it points.
            description: 'The fields of a Bookmark to change. Every member is optional: one left out is left alone, and an explicit null clears it.'
        Error:
            type: object
            properties:
                code:
                    $ref: '#/components/schemas/ErrorCode'
                    description: Machine-readable reason the request failed.
                message:
                    type: string
                    description: Human-readable explanation. Not intended for clients to parse.
                requestId:
                    type:
                        - string
                        - "null"
                    description: Identifier of this request, for correlating with server logs.
                fields:
                    description: Present when the failure was validation. It is shaped like the request body that failed — one member per field, holding the problem with that field — so a client can put each message beside the control it belongs to.
            description: Returned whenever a request fails.
        ErrorCode:
            type: string
            enum:
                - BadRequest
                - Unauthorized
                - Forbidden
                - NotFound
                - Conflict
                - UnprocessableEntity
                - RateLimited
                - TooLarge
                - UnsupportedMediaType
                - UpgradeRequired
                - Internal
            description: Machine-readable reason a request failed.
            x-enum-varnames:
                - BadRequest
                - Unauthorized
                - Forbidden
                - NotFound
                - Conflict
                - UnprocessableEntity
                - RateLimited
                - TooLarge
                - UnsupportedMediaType
                - UpgradeRequired
                - Internal
        Pagination:
            type: object
            properties:
                offset:
                    type: integer
                    format: int32
                    description: Number of rows skipped before this page.
                limit:
                    type: integer
                    format: int32
                    description: Maximum number of rows in this page.
                total:
                    type: integer
                    format: int64
                    description: Total number of rows matching the query, ignoring pagination.
            description: Where the returned page sits within the full result set.
    responses:
        BadRequest:
            description: |-
                The request was malformed or a parameter could not be parsed.

                The body's `code` is `BadRequest`.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        Unauthorized:
            description: |-
                No valid session or API key was presented.

                The body's `code` is `Unauthorized`.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        Forbidden:
            description: |-
                The caller is known but not permitted to do this.

                The body's `code` is `Forbidden`.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        NotFound:
            description: |-
                No such resource, or it belongs to another tenant.

                The body's `code` is `NotFound`.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        Conflict:
            description: |-
                The request conflicts with the current state of the resource.

                The body's `code` is `Conflict`.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        UnprocessableEntity:
            description: |-
                The request was well-formed but failed validation.

                The body's `code` is `UnprocessableEntity`.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        RateLimited:
            description: |-
                Too many requests. Retry after the interval in the Retry-After header.

                The body's `code` is `RateLimited`.
            headers:
                Retry-After:
                    $ref: '#/components/headers/RetryAfter'
                RateLimit-Limit:
                    $ref: '#/components/headers/RateLimitLimit'
                RateLimit-Remaining:
                    $ref: '#/components/headers/RateLimitRemaining'
                RateLimit-Reset:
                    $ref: '#/components/headers/RateLimitReset'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        Internal:
            description: |-
                Something went wrong on the server.

                The body's `code` is `Internal`.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
    parameters:
        ApiRevision:
            name: API-Revision
            in: header
            description: The API revision this client was built against. A server generated from an older document than the caller expects answers 426 rather than guessing.
            required: false
            schema:
                type: string
        IdempotencyKey:
            name: Idempotency-Key
            in: header
            description: A key of the caller's choosing, so a retried write happens once. Sending the same key with the same body replays the first answer and sets Idempotency-Replayed; with a different body it is refused with 422, and while the first is still in flight, with 409.
            required: false
            schema:
                type: string
    headers:
        ApiRevision:
            description: The revision this server was generated from.
            schema:
                type: string
        IdempotencyReplayed:
            description: Present and true when this answer is a replay of an earlier request carrying the same Idempotency-Key, rather than work done again.
            schema:
                type: boolean
        RateLimitLimit:
            description: Requests permitted in the current window.
            schema:
                type: integer
        RateLimitRemaining:
            description: Requests left in the current window.
            schema:
                type: integer
        RateLimitReset:
            description: Seconds until the current window resets.
            schema:
                type: integer
        RetryAfter:
            description: Seconds to wait before retrying.
            schema:
                type: integer
    securitySchemes:
        bearerAuth:
            type: http
            description: |-
                A credential in `Authorization: Bearer <token>`.

                Two kinds are accepted and are told apart by a prefix on the token itself. A session access token travels on every request and is good for 10m, renewed against the session endpoints before it expires. An API key does not expire: an integration key's scopes are its permissions outright, and a personal key carries what its owner carries and no more.

                The endpoints that issue and renew these are mounted under `/auth` and are not described in this document.
            scheme: bearer
            bearerFormat: opaque
security:
    - bearerAuth: []
tags:
    - name: Bookmarks
      description: A link somebody saved.
