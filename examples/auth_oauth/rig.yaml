# yaml-language-server: $schema=.rig/rig.schema.json
version: 1

project:
  name: "auth_oauth"
  module: "github.com/simonjanss/rig/examples/auth_oauth"


# Every table gets a configuration file. `rig sync` creates and updates them.
layout:
  table_dir: services/{table}
  config_file: "{table_dir}/{table}.yaml"

# rig's own tables stay in the modules that own them, so migrations/ below holds
# only this example's two migrations rather than a thousand lines of DDL nobody
# here wrote. examples/auth is the other half of the pair and vendors them, which
# is the default — between them both readings are built and run on every check.
#
# The cost is admitted rather than argued away: this directory no longer says what
# is in the database. What is in it is these two files plus whatever `rig/auth`
# ships, and `rig db up` applies the second set first.
migrations:
  foundation: embedded

# Its own throwaway Postgres, so this example and examples/auth can both be up.
database:
  port: 55443
  container_name: rig-oauth-db

api:
  version: v1
  base_path: /api/v1
  # No derived permissions. This example is about who somebody is, not about what
  # they may do — that is examples/auth's subject, and deny-by-default here would
  # mean seeding roles nothing reads.
  permissions: none

# The whole of this example's authentication, and the point of it: a tenant per
# host, and a provider sign-in that survives the redirect.
#
# A provider sign-in has to know the tenant *before* the redirect, because that
# is what the callback joins somebody to — and the callback URL is registered
# with the provider and fixed, so it carries nothing an application could read on
# the way back. A header does not survive it. A query parameter does not survive
# it. A host does.
auth:
  enabled: true

  tenant:
    from: [host]
    # Google and Microsoft will not register a plain-http redirect URI for
    # anything but localhost, so `acme.localhost:8083` — which this example is
    # built around — cannot be given to either. Naming a tenant for the host with
    # no subdomain is what lets a real sign-in be tried on a laptop: run at
    # http://localhost:8083 with DEFAULT_TENANT=acme and register that one origin.
    default_slug_env: DEFAULT_TENANT

  oauth:
    # The origin a provider redirects back to, and the environment gets the last
    # word: a test serves on an ephemeral port and has to be able to say so.
    base_url: http://acme.localhost:8083
    base_url_env: BASE_URL

    # A callback comes back to the host it started at. The state cookie carrying
    # the PKCE verifier is set on that host, and a browser will not send it to a
    # sibling subdomain — so the callback URL is per host, and every one of them
    # is registered with the provider.
    origin_from_host: true

    # On, so a stranger with a provider account joins the tenant they signed in
    # at. A business application leaves it off and a provider sign-in then only
    # works for somebody already invited.
    allow_provisioning: true

    # Plain HTTP on localhost, so the __Host- cookie a browser would insist on is
    # unavailable. Never set this anywhere real.
    insecure: true

    # Credentials are named, not carried. Set a pair and that provider appears;
    # set none and the stand-in in services/idp appears instead, which is what
    # makes this example work the moment it is cloned.
    providers:
      - name: google
      - name: microsoft
      - name: github

# Convention rules. Each is off, warn, or error.
validate:
  unmentioned_column: warn
  missing_comment: error
  fk_needs_index: error
  tenant_id_leading_index: error
  boolean_prefix: warn

generators:
  # The entity, its enums, its query types, and its inputs. Both of the
  # layers below import this one, so there is one definition of a row
  # rather than a copy on each side and a conversion between them.
  - name: model-go
    out_dir: internal/model
    options:
      package: model

  # The repository interface and its pgx implementation.
  - name: persist-go
    out_dir: internal/store
    options:
      package: store
      model_import: github.com/simonjanss/rig/examples/auth_oauth/internal/model

  # Wire types, the interface your service layer implements, and a
  # working default implementation of every operation.
  - name: service-go
    out_dir: internal/api
    options:
      package: api
      model_import: github.com/simonjanss/rig/examples/auth_oauth/internal/model
      store_import: github.com/simonjanss/rig/examples/auth_oauth/internal/store
      api_import: github.com/simonjanss/rig/examples/auth_oauth/internal/api
      # Where your service layer goes. Written once, then yours.
      stub_dir: services/{table}

  # Routing and handlers — and, from the auth block above, the wiring beside
  # them: the host lookup, the provider construction, and the state cookie's
  # settings. One package, so the sign-in endpoint fails the way every other
  # endpoint does.
  - name: server-go
    out_dir: internal/api
    options:
      package: api
      model_import: github.com/simonjanss/rig/examples/auth_oauth/internal/model

  # The OpenAPI document, written from the same compiled document the routes
  # above are, so it cannot describe an endpoint that does not exist.
  - name: openapi
    out_dir: docs
    options:
      formats: [json, yaml]

  # Live-sync shape endpoints. It writes nothing until a table asks
  # for one with `electric: {enabled: true}`, so leaving it here costs
  # nothing and turning it on is one line in a table's configuration.
  - name: electric
    out_dir: internal/electric
    options:
      package: electric
      electric_url: http://localhost:3000
      shape_import: github.com/simonjanss/rig/examples/auth_oauth/internal/electric
      # Where your extra scoping goes. Written once, then yours.
      stub_dir: services/{table}
