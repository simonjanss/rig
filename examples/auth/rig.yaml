# yaml-language-server: $schema=.rig/rig.schema.json
version: 1

project:
  name: "auth"
  module: "github.com/simonjanss/rig/examples/auth"

api:
  version: v1
  base_path: /api/v1

# The authentication foundation. Everything with a fixed answer is here rather
# than in main.go, because the documentation and the client libraries are
# generated from this file: a token lifetime written in a Go literal is a token
# lifetime nothing else can read.
#
# What is left in main.go is the three things a file cannot hold — who holds a
# permission, where mail goes, what a new tenant needs — and nothing else.
auth:
  enabled: true

  # Anybody may sign themselves up, because this example's answer to "who may
  # create a tenant" is also anybody. A product with an invite-only front door
  # leaves both of these off and the routes do not exist.
  allow_registration: true
  allow_tenant_creation: true

  # A browser following a provider link cannot set a header, and the tenant has
  # to be known before the redirect, so this example reads the query string
  # first and the header after. A real deployment answers with the host —
  # acme.example.com — which is `from: [host]`; see examples/auth_oauth.
  tenant:
    from: [query, header]

  # Ninety days of authentication trail, then `auth prune-auth-log` takes it. The
  # window has a floor rig refuses to go under: the rate limits are counted from
  # rig_auth_log, so pruning inside one of their windows would clear a lockout by
  # deleting the failures it counts. Leaving this out keeps everything, which is
  # the default because how long a trail has to survive is a compliance question
  # and not rig's to answer.
  log_retention: 90d

# Verifying a session and verifying an API key are the two reads rig makes on
# behalf of every caller, and this is what stops them being a row read each.
#
# It is not a time-to-live over authentication — that would be a revoked session
# that keeps working, and rig does not offer it. Every revocation rig performs
# publishes on the transaction that performed it, over a Postgres channel every
# replica listens on, so a session ended here stops working everywhere the moment
# that transaction commits. `ttl` is what remains for a replica that lost the
# channel, and a replica that has lost it stops caching rather than serving
# something it can no longer withdraw.
#
# There is nothing in main.go to match this. rig makes both of these reads and
# rig makes every write that invalidates them, which is exactly why they are the
# ones cached: an application has no publish to remember and no write path it can
# leave out. The read rig deliberately does not cache is Grants, in
# services/authz — that one is over this example's own role tables, and rig
# cannot see those writes.
cache:
  enabled: true

# The inbox. `enabled` is what makes server-go write the engine, the dispatcher
# and the routes under /notifications; a project without this block carries none
# of it.
#
# `expose` is off, which is the ordinary case: the hand-written routes serve the
# inbox, and rig's two tables keep their model and their repository and get no
# endpoints of their own. Turning it on would add a projected resource beside
# them, with the filter grammar and a typed client — both stay, and the
# difference between them is the point.
notifications:
  enabled: true

# A throwaway Postgres, created on demand. The port is explicit so this example
# can run alongside the others.
database:
  image: postgres:17-alpine
  port: 55442

# Every table gets a configuration file. `rig sync` creates and updates them.
layout:
  table_dir: services/{table}
  config_file: "{table_dir}/{table}.yaml"

# Convention rules. Each is off, warn, or error.
validate:
  unmentioned_column: warn
  missing_comment: error
  fk_needs_index: error
  tenant_id_leading_index: error
  boolean_prefix: warn

generators:
  # The entity, its enums, its query types, and its inputs. Both of the
  # layers below import this one, so there is one definition of a row
  # rather than a copy on each side and a conversion between them.
  - name: model-go
    out_dir: internal/model
    options:
      package: model

  # The repository interface and its pgx implementation.
  - name: persist-go
    out_dir: internal/store
    options:
      package: store
      model_import: github.com/simonjanss/rig/examples/auth/internal/model

  # Wire types, the interface your service layer implements, and a
  # working default implementation of every operation.
  - name: service-go
    out_dir: internal/api
    options:
      package: api
      model_import: github.com/simonjanss/rig/examples/auth/internal/model
      store_import: github.com/simonjanss/rig/examples/auth/internal/store
      api_import: github.com/simonjanss/rig/examples/auth/internal/api
      # Where your service layer goes. Written once, then yours.
      stub_dir: services/{table}

  # Routing and handlers — and, because the auth block above is enabled, the
  # authentication wiring beside them. It goes in this package rather than one
  # of its own so a 401 from the sign-in endpoint is shaped by the same error
  # mapper as a 401 from anywhere else. A project with no auth block gets no
  # such file, and so never depends on rig/auth: see examples/todo.
  - name: server-go
    out_dir: internal/api
    options:
      package: api
      model_import: github.com/simonjanss/rig/examples/auth/internal/model
      api_import: github.com/simonjanss/rig/examples/auth/internal/api
      # Live sync. A table asks for a stream with `electric: {enabled: true}`,
      # and the routes are mounted beside the rest of its API — same mux, same
      # claims lookup, same error mapper. Until one asks, none of this writes
      # anything.
      electric_url: http://localhost:3000
      # Where your extra shape scoping goes, beside the service layer for the
      # same table. Written once, then yours.
      stub_dir: services/{table}

  # A typed Go client for this API. Because this project has an auth
  # block, it also gets the profile the client reads: the base path and
  # the token lifetimes the server actually enforces, so a session can
  # refresh ahead of expiry instead of waiting to be refused.
  - name: go-client
    out_dir: client
    options:
      package: client

  # The OpenAPI document, written from the same compiled document the routes
  # above are, so it cannot describe an endpoint that does not exist.
  - name: openapi
    out_dir: docs
    options:
      formats: [json, yaml]
