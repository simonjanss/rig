# yaml-language-server: $schema=../../.rig/table.schema.json
table: rig_account
comment: One person inside one tenant. The person is the identity; this is who they are here.

# The one foundation table this example exposes — `auth.expose` in rig.yaml is
# what put it in the generated set. The board needs names to put on assignees,
# and this is the documented way to get them: rig/auth keeps its own queries
# against this table, and a read-only resource appears beside them.
#
# Read-only from the outside, deliberately. Provisioning, invitations and
# deactivation are the auth endpoints' business, and a generated write here
# would be a second door into rows the foundation owns.
operations: [Get, List]

# Days a soft-deleted row stays restorable.
restore_window_days: 30

columns:
  identity_id:
    comment: The person this account belongs to, or null for a service account, which is nobody.
  kind:
    comment: Whether this is a person or a service account an integration acts as.
  role:
    comment: 'The coarse level in this tenant: Owner, Admin, or Basic. Somebody can be an Owner here and Basic elsewhere.'
  email_address:
    comment: 'A copy of the identity''s address, kept here so listing accounts is one query. For a service account it is a label nobody signs in with.'
  display_name:
    comment: What to call the person in this tenant.
  time_zone:
    comment: IANA name, for example Europe/Stockholm. Null means UTC.
  is_active:
    comment: Whether the account may be used. A disabled account is refused with 403, not 401.

enums:
  rig_account_kind:
    name: RigAccountKind
    description: Whether an account is a person or a machine.
    values:
      Person:
        name: Person
        description: Somebody who signs in.
      Service:
        name: Service
        description: An account an integration's API key acts as. Nobody signs in to it.
  rig_account_role_level:
    name: RigAccountRoleLevel
    description: The coarse level an account holds in its tenant.
    values:
      Owner:
        name: Owner
        description: Runs the tenant.
      Admin:
        name: Admin
        description: Administers it without owning it.
      Basic:
        name: Basic
        description: An ordinary member. This is the default.
