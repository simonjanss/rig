# yaml-language-server: $schema=../../.rig/table.schema.json
table: rig_notification_setting
comment: 'What somebody wants on a channel, and when. Resolved in three steps: this kind, then this channel, then the project default.'

# Read your own, write one, change one, and delete one — which is how somebody
# goes back to the project default, because the absence of a row is what
# `default_digest` answers for.
operations: [List, Create, Update, Delete]

# Owner-scoped for the reason the devices are, and named for the same reason:
# there is no created_by_account_id here, and account_id is whose preference it
# is. The engine reads these by account_id too, so the column a read narrows on
# and the column a send resolves on are one column.
access:
  scope: own
  owner: account_id

columns:
  account_id:
    comment: Whose preference it is.
  kind:
    comment: Null is the default for the channel, which is the second step of the resolution.
  channel:
    comment: Which channel it answers for.
  is_enabled:
    comment: False writes no delivery row at all. Not the same as digest Off, which is about preferring to look rather than be told.
  digest:
    comment: Immediate sends each on its own; anything else waits for the window and goes out as one message.
  active_from:
    comment: 'When to start delivering, in the account time zone. Null means all day. A window that wraps midnight is ordinary: 22:00 to 06:00 is how somebody says "not overnight".'
  active_until:
    comment: 'When to stop. Outside the window a delivery is held, not dropped: the inbox line exists either way, and a discarded copy makes the badge and the mailbox disagree.'
  active_days:
    comment: 'ISO weekdays, 1 being Monday. Empty means every day. An array rather than a bitmask because [1,2,3,4,5] is legible in a settings payload and 62 is not.'

# rig's own enums, described here because this is the table where a person meets
# both of them. rig ships the types and no prose for them — they are foundation
# tables, and what a value means to a product is the product's to say — so
# without this the generated clients and the OpenAPI document carry TODOs.
enums:
  rig_notification_channel:
    name: RigNotificationChannel
    description: Where a copy of an inbox line can be sent. The inbox itself is not one of them.
    values:
      Desktop:
        name: Desktop
        description: A browser or a desktop application, addressed by a device row.
      Mobile:
        name: Mobile
        description: A phone, addressed by a device row.
      Email:
        name: Email
        description: 'The address on the account. No device row: there is nothing to register, because the address is on the account already.'
  rig_notification_digest:
    name: RigNotificationDigest
    description: How often somebody wants to be told, on one channel.
    values:
      Immediate:
        name: Immediate
        description: Each notification on its own, as soon as it is due.
      Hourly:
        name: Hourly
        description: Whatever accumulated in an hour, as one message.
      Daily:
        name: Daily
        description: The same, a day at a time.
      Weekly:
        name: Weekly
        description: The widest window, and the one notifications.retention has to outlive — a weekly digest is assembled from rows a shorter retention would have pruned.
      Off:
        name: Off
        description: 'Nothing on this channel, and the inbox line is written anyway: this is somebody preferring to look rather than be told. is_enabled false is the other thing, and says the channel is not available to them at all.'
