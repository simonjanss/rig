# yaml-language-server: $schema=../../.rig/table.schema.json
table: rig_notification
comment: 'Something worth telling somebody about, and when it is due. Carries no recipients: the audience is computed when it is sent.'

# No endpoints. A notification carries no recipients — the audience is computed
# when it is sent — so a client reading this table would be reading rows that
# name nobody, including ones nobody will ever be told about. What a person is
# owed is the inbox, and that has rig's own routes and a live shape.
expose: false

columns:
  kind:
    comment: What happened, as the application names it. Narrow it to an enum of your own to get a switch the compiler can see.
  state:
    comment: Resolved means the audience was determined and the inbox lines exist. It does not mean anything was sent.
  deliver_at:
    comment: When this is due. now() is the ordinary case; a scheduled notification is the same row with a later time, which is the only difference between the two.
  resolved_at:
    comment: When the audience was computed. Null while the notification is still pending or was cancelled.
  payload:
    comment: What a template needs beyond the linked row. Give it a Go type with the go_type key if it has a shape.
  group_key:
    comment: What collapses several of these into one inbox line, decided when the announcement was written and copied onto the line when the audience is resolved.
  account_ids:
    comment: A recipient list captured at write time, and the one exception to computing the audience late. Null is the ordinary case; a list here skips the question entirely, for an audience that genuinely cannot be re-derived.
  claimed_at:
    comment: When a dispatcher took this to resolve. Past notifications.claim_ttl another may, which is what makes a crashed process recoverable.
  claimed_by:
    comment: Which process holds the lease, so a stuck one traces to a pod rather than to a mystery.
  attempts:
    comment: How many times resolving this has been attempted.

enums:
  rig_notification_state:
    name: RigNotificationState
    description: 'Where a notification is in its life. Nothing here says anything was sent: that is the delivery table''s business.'
    values:
      Pending:
        name: Pending
        description: The audience has not been computed yet. Every notification starts here, and a scheduled one waits here until it is due.
      Resolved:
        name: Resolved
        description: The audience was computed and the inbox lines exist. It does not mean anything was sent — a notification with an inbox line and no mail is a working notification.
      Cancelled:
        name: Cancelled
        description: 'It never will be resolved: the row it was about was retired before its time came.'
