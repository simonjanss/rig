# yaml-language-server: $schema=../../.rig/table.schema.json
table: rig_notification_delivery
comment: One copy of an inbox line on its way to a channel. Claimed by lease, sent outside any transaction, and marked afterwards.

# No endpoints. This is the dispatcher's bookkeeping: one row per copy per
# channel, claimed by lease and marked afterwards. Reading it from a browser
# would be reading the queue rather than the mail, and the model and repository
# — which is what the engine uses — are generated either way.
expose: false

columns:
  recipient_id:
    comment: The inbox line this is a copy of. The line is the truth and this is one way it was repeated.
  account_id:
    comment: Who it is for, denormalized off the line so a claim can group by it without a join.
  channel:
    comment: Where it is going. One row per line per channel, which is what the unique index below enforces.
  kind:
    comment: Copied from the notification, so the settings resolution needs no join either.
  digest:
    comment: What the setting said when this row was written. Immediate rows are sent on their own; the rest are batched per account and channel.
  state:
    comment: Skipped means a setting refused it, which is different from Failed and worth telling apart in a report.
  deliver_at:
    comment: When this is due. A delivery held outside somebody hours moves to the next opening; a digested one moves to its window close.
  sent_at:
    comment: When a channel accepted it, which is not the same as it arriving.
  failed_reason:
    comment: What the channel said last time. Kept on a retry as well as on a failure, so a pattern is visible before the cap is reached.
  attempts:
    comment: How many times this has been claimed. Past notifications.max_attempts it is Failed and stops being claimed.
  claimed_at:
    comment: When a dispatcher took it. Past notifications.claim_ttl another one may, which is what makes a crashed process recoverable.
  claimed_by:
    comment: Which process holds the lease. A uuid generated once per process, with the hostname beside it in the log line, so a stuck lease traces to a pod rather than to a mystery.

enums:
  rig_notification_channel:
    name: RigNotificationChannel
    description: Where a copy of an inbox line can be sent. The inbox itself is not one of them.
    values:
      Desktop:
        name: Desktop
        description: A browser or a desktop application, addressed by a device row.
      Mobile:
        name: Mobile
        description: A phone, addressed by a device row.
      Email:
        name: Email
        description: 'The address on the account. No device row: there is nothing to register, because the address is on the account already.'
  rig_notification_delivery_state:
    name: RigNotificationDeliveryState
    description: What happened to one copy of an inbox line on its way to a channel.
    values:
      Pending:
        name: Pending
        description: Owed and not yet claimed, or claimed by a dispatcher that has not marked it.
      Sent:
        name: Sent
        description: A channel accepted it, which is not the same as it arriving — rig does not pretend to know the difference.
      Failed:
        name: Failed
        description: Past notifications.max_attempts, and no longer claimed. Without the cap a permanently broken address would consume a lease forever.
      Skipped:
        name: Skipped
        description: 'A setting refused it, or the row it was a copy of was retired before it went. Worth telling apart from Failed in a report: it is ''we decided against this'' rather than ''this did not work''.'
  rig_notification_digest:
    name: RigNotificationDigest
    description: How often somebody wants to be told, on one channel.
    values:
      Immediate:
        name: Immediate
        description: Each notification on its own, as soon as it is due.
      Hourly:
        name: Hourly
        description: Whatever accumulated in an hour, as one message.
      Daily:
        name: Daily
        description: The same, a day at a time.
      Weekly:
        name: Weekly
        description: The widest window, and the one notifications.retention has to outlive — a weekly digest is assembled from rows a shorter retention would have pruned.
      Off:
        name: Off
        description: 'Nothing on this channel, and the inbox line is written anyway: this is somebody preferring to look rather than be told. is_enabled false is the other thing, and says the channel is not available to them at all.'
