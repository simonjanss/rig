# yaml-language-server: $schema=../../.rig/table.schema.json
table: rig_notification_delivery
comment: One copy of an inbox line on its way to a channel. Claimed by lease, sent outside any transaction, and marked afterwards.

columns:
  recipient_id:
    comment: The inbox line this is a copy of. The line is the truth and this is one way it was repeated.
  account_id:
    comment: Who it is for, denormalized off the line so a claim can group by it without a join.
  channel:
    comment: Where it is going. One row per line per channel, which is what the unique index below enforces.
  kind:
    comment: Copied from the notification, so the settings resolution needs no join either.
  digest:
    comment: What the setting said when this row was written. Immediate rows are sent on their own; the rest are batched per account and channel.
  state:
    comment: Skipped means a setting refused it, which is different from Failed and worth telling apart in a report.
  deliver_at:
    comment: When this is due. A delivery held outside somebody hours moves to the next opening; a digested one moves to its window close.
  sent_at:
    comment: When a channel accepted it, which is not the same as it arriving.
  failed_reason:
    comment: What the channel said last time. Kept on a retry as well as on a failure, so a pattern is visible before the cap is reached.
  attempts:
    comment: How many times this has been claimed. Past notifications.max_attempts it is Failed and stops being claimed.
  claimed_at:
    comment: When a dispatcher took it. Past notifications.claim_ttl another one may, which is what makes a crashed process recoverable.
  claimed_by:
    comment: Which process holds the lease. A uuid generated once per process, with the hostname beside it in the log line, so a stuck lease traces to a pod rather than to a mystery.

