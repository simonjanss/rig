                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: todo.write
    /api/v1/todos/{id}/_claim:
        post:
            tags:
                - Todos
            summary: Take the item.
            description: |-
                Taking an item somebody else holds is a conflict rather than a
                reassignment: two people picking up the same thing should not both be
                told they have it. Taking one nobody holds is the ordinary case, and
                taking one you already hold is not an error — a button pressed twice is
                not a disagreement.

                `steal` is the deliberate override, for the person who means it. It goes
                through the same update as everything else, so the previous holder hears
                about it the way they hear about any other change to their item.


                Requires the `todo.claim` permission.
            operationId: claimTodo
            parameters:
                - name: id
                  in: path
                  description: The item to take.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                description: The request body for Todo.Claim.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TodoClaimBody'
                required: true
            responses:
                "200":
                    description: The item, now yours.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                        Idempotency-Replayed:
                            $ref: '#/components/headers/IdempotencyReplayed'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Todo'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    description: Somebody else holds it, and steal was not set.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: todo.claim
    /api/v1/todos/{id}/_restore:
        post:
            tags:
                - Todos
            summary: Bring a retired Todo back.
            description: |-
                The deletion stamp is cleared and the row appears in reads again. It works for 30 days after the deletion; past that the row is no longer eligible and this answers 409.

                Restoring a row that was never deleted is not an error. It is already in the state the caller asked for, and answering otherwise would make a retry of a request whose response went missing look like a failure.

                The request carries no fields. What to do when the world has moved on while the row was retired — a unique value taken by something created since — is the application's decision, and it is made in the restore hook: refuse, or change the row so that it fits.

                Every rule then runs against whatever the hook settled on, not only the ones for fields it touched. The row was not live, so nothing about it has been checked against the world it is returning to.

                Requires the `todo.write` permission.
            operationId: restoreTodo
            parameters:
                - name: id
                  in: path
                  description: Identifier of the Todo.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
                - $ref: '#/components/parameters/IdempotencyKey'
            responses:
                "200":
                    description: The restored Todo.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                        Idempotency-Replayed:
                            $ref: '#/components/headers/IdempotencyReplayed'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Todo'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: todo.write
    /api/v1/todos/{id}/_revert:
        post:
            tags:
                - Todos
            summary: Put a Todo back to one of its previous versions.
            description: |-
                The version is replayed through the ordinary update path rather than written over the row, so the state being replaced is itself snapshotted first and every rule an update runs still runs. Reverting is undoable, and a value that would be refused now is still refused.

                Requires the `todo.write` permission.
            operationId: revertTodo
            parameters:
                - name: id
                  in: path
                  description: Identifier of the Todo.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                description: The request body for Todo.Revert.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TodoRevertBody'
                required: true
            responses:
                "200":
                    description: The Todo, as of the version replayed.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                        Idempotency-Replayed:
                            $ref: '#/components/headers/IdempotencyReplayed'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Todo'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: todo.write
    /api/v1/todos/{id}/_versions:
        get:
            tags:
                - Todos
            summary: List a Todo's previous versions.
            description: |-
                Every update copies the row as it was before writing the change, so this is the row's history: newest first, and never the live row itself.

                These do not appear in ordinary reads. A version answers Get by its own identifier, but it is filtered out of List and Search, so history does not turn up in a listing.

                Requires the `todo.read` permission.
            operationId: versionsOfTodo
            parameters:
                - name: id
                  in: path
                  description: Identifier of the Todo.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: The versions of the Todo, newest first.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TodoListResponse'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: todo.read
components:
    schemas:
        Account:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                    description: Unique identifier for this row.
                    readOnly: true
                tenantId:
                    type: string
                    format: uuid
                    description: Tenant this row belongs to. Every query is scoped by it.
                    readOnly: true
                identityId:
                    type:
                        - string
                        - "null"
                    format: uuid
                    description: The person this account belongs to, or null for a service account, which is nobody.
                createdAt:
                    type: string
                    format: date-time
                    description: When this row was created. Set automatically and never changes.
                    readOnly: true
                createdByAccountId:
                    type:
                        - string
                        - "null"
                    format: uuid
                    description: Account that created this row, taken from the request's claims.
                    readOnly: true
                updatedAt:
                    type:
                        - string
                        - "null"
                    format: date-time
                    description: When this row was last updated. Set automatically on every update.
                    readOnly: true
                updatedByAccountId:
                    type:
                        - string
                        - "null"
                    format: uuid
                    description: Account that last updated this row, taken from the request's claims.
                    readOnly: true
                deletedAt:
                    type:
                        - string
                        - "null"
                    format: date-time
                    description: When this row was soft-deleted. Null while the row is live.
                    readOnly: true
                deletedByAccountId:
                    type:
                        - string
                        - "null"
                    format: uuid
                    description: Account that soft-deleted this row, taken from the request's claims.
                    readOnly: true
                kind:
                    $ref: '#/components/schemas/RigAccountKind'
                    description: Whether this is a person or a service account an integration acts as.
                role:
                    $ref: '#/components/schemas/RigAccountRoleLevel'
                    description: 'The coarse level in this tenant: Owner, Admin, or Basic. Somebody can be an Owner here and Basic elsewhere.'
                emailAddress:
                    type: string
                    description: A copy of the identity's address, kept here so listing accounts is one query. For a service account it is a label nobody signs in with.
                displayName:
                    type: string
                    description: What to call the person in this tenant.
                timeZone:
                    type:
                        - string
                        - "null"
                    description: IANA name, for example Europe/Stockholm. Null means UTC.
                isActive:
                    type: boolean
                    description: Whether the account may be used. A disabled account is refused with 403, not 401.
                createdByApiKeyId:
                    type:
                        - string
                        - "null"
                    format: uuid
                    description: API key this row was created through, when it was an integration rather than a person.
                    readOnly: true
                updatedByApiKeyId:
                    type:
                        - string
                        - "null"
                    format: uuid
                    description: API key this row was last updated through, when it was an integration rather than a person.
                    readOnly: true
                deletedByApiKeyId:
                    type:
                        - string
                        - "null"
                    format: uuid
                    description: API key this row was soft-deleted through, when it was an integration rather than a person.
                    readOnly: true
            description: One person inside one tenant. The person is the identity; this is who they are here.
        AccountListResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/Account'
                    description: The rows in this page.
                pagination:
                    $ref: '#/components/schemas/Pagination'
                    description: Where this page sits in the full result set.
            description: A page of Accounts.
        Error:
            type: object
            properties:
                code:
                    $ref: '#/components/schemas/ErrorCode'
                    description: Machine-readable reason the request failed.
                message:
                    type: string
                    description: Human-readable explanation. Not intended for clients to parse.
                requestId:
                    type:
                        - string
                        - "null"
                    description: Identifier of this request, for correlating with server logs.
                fields:
                    description: Present when the failure was validation. It is shaped like the request body that failed — one member per field, holding the problem with that field — so a client can put each message beside the control it belongs to.
            description: Returned whenever a request fails.
        ErrorCode:
            type: string
            enum:
                - BadRequest
                - Unauthorized
                - Forbidden
                - NotFound
                - Conflict
                - UnprocessableEntity
                - RateLimited
                - TooLarge
                - UnsupportedMediaType
                - UpgradeRequired
                - Internal
            description: Machine-readable reason a request failed.
            x-enum-varnames:
                - BadRequest
                - Unauthorized
                - Forbidden
                - NotFound
                - Conflict
                - UnprocessableEntity
                - RateLimited
                - TooLarge
                - UnsupportedMediaType
                - UpgradeRequired
                - Internal
        Pagination:
            type: object
            properties:
                offset:
                    type: integer
                    format: int32
                    description: Number of rows skipped before this page.
                limit:
                    type: integer
                    format: int32
                    description: Maximum number of rows in this page.
                total:
                    type: integer
                    format: int64
                    description: Total number of rows matching the query, ignoring pagination.
            description: Where the returned page sits within the full result set.
        RigAccountKind:
            type: string
            enum:
                - Person
                - Service
            description: Whether an account is a person or a machine.
            x-enum-varnames:
                - Person
                - Service
        RigAccountRoleLevel:
            type: string
            enum:
                - Owner
                - Admin
                - Basic
