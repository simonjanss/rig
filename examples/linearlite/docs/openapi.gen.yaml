                    type: string
                - name: handle
                  in: query
                  description: The shape handle from a previous response. Omit it to start a new subscription.
                  required: false
                  schema:
                    type: string
                - name: live
                  in: query
                  description: Long-poll until something changes, rather than answering with what is there now.
