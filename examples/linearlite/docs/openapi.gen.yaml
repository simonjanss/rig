            x-rig-permission: todo.read
    /api/v1/todos/{id}:
        get:
            tags:
                - Todos
            summary: Fetch one Todo by identifier.
            description: |-
                Fetch one Todo by identifier.

                Requires the `todo.read` permission.
            operationId: getTodo
            parameters:
                - name: id
                  in: path
                  description: Identifier of the Todo.
                  required: true
                  schema:
                    type: string
