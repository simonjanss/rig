            summary: Create a TodoAttachment.
            description: |-
                Create a TodoAttachment.

                Requires the `todo_attachment.write` permission.
            operationId: createTodoAttachment
            parameters:
                - $ref: '#/components/parameters/ApiRevision'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                description: The TodoAttachment to create, as JSON — or as a multipart form when its files are being attached in the same request.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TodoAttachmentCreateInput'
