                    type: boolean
                - name: cursor
                  in: query
                  description: The sync service's own cache-busting cursor, echoed back from the last response.
                  required: false
                  schema:
                    type: string
                - name: replica
                  in: query
                  description: Whether updates carry the whole row or only the columns that changed.
                  required: false
                  schema:
                    type: string
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: A chunk of the shape, in the sync protocol's own format.
                    headers:
                        electric-handle:
                            description: The shape handle. Send it back to continue this subscription.
                            schema:
                                type: string
                        electric-offset:
                            description: Where this chunk ended. Send it back to resume from here.
                            schema:
                                type: string
                        electric-schema:
                            description: The shape's column types.
                            schema:
                                type: string
                        electric-cursor:
                            description: The cursor to echo on the next request.
                            schema:
                                type: string
                        electric-up-to-date:
                            description: Present when the client has caught up with the shape.
                            schema:
                                type: string
                    content:
                        application/json: {}
