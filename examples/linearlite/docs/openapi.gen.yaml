                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: The requested Todo.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Todo'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: todo.read
        delete:
            tags:
                - Todos
            summary: Delete a Todo.
            description: |-
                The row is retired by stamping a deletion time; it stops appearing in reads but can be restored within the retention window.

                Requires the `todo.delete` permission.
            operationId: deleteTodo
            parameters:
                - name: id
                  in: path
                  description: Identifier of the Todo.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "204":
                    description: The Todo was deleted.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: todo.delete
        patch:
            tags:
                - Todos
            summary: Update a Todo.
            description: |-
                Only the fields present in the body are changed. A field set to null is cleared; a field left out is left alone.

                Requires the `todo.write` permission.
            operationId: updateTodo
            parameters:
                - name: id
                  in: path
                  description: Identifier of the Todo.
                  required: true
