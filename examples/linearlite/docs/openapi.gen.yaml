            summary: Update a RigNotificationSetting.
            description: |-
                Only the fields present in the body are changed. A field set to null is cleared; a field left out is left alone.

                Requires the `rig_notification_setting.write` permission.
            operationId: updateRigNotificationSetting
            parameters:
                - name: id
                  in: path
                  description: Identifier of the RigNotificationSetting.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                description: 'The fields of a RigNotificationSetting to change. Every member is optional: one left out is left alone, and an explicit null clears it.'
                content:
