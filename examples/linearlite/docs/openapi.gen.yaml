openapi: 3.1.0
info:
    title: linearlite
    description: |-
        The linearlite HTTP API.

        The authentication endpoints under `/auth` are served by a hand-written module and are not described here.

        The notification inbox endpoints are served by a hand-written module and are not described here.
    version: "2026-08-24"
servers:
    - url: /
      description: This server. Set openapi.servers to name the deployment instead.
paths:
    /api/v1/accounts:
        get:
            tags:
                - Accounts
            summary: List Accounts.
            description: |-
                List Accounts.

                Requires the `rig_account.read` permission.
            operationId: listAccounts
            parameters:
                - name: limit
                  in: query
                  description: Maximum rows to return.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 50
                - name: offset
                  in: query
                  description: Rows to skip before the first returned row.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 0
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: A page of Accounts.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountListResponse'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: rig_account.read
    /api/v1/accounts/_deleted:
        get:
            tags:
                - Accounts
            summary: List retired Accounts.
            description: |-
                A deletion stamps the row rather than removing it, so this is what was deleted and can still be brought back. Only rows inside the 30-day restore window appear: past it a row is gone as far as anyone is concerned, so it is not in the trash either.

                Requires the `rig_account.read` permission.
            operationId: listDeletedAccounts
            parameters:
                - name: limit
                  in: query
                  description: Maximum rows to return.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 50
                - name: offset
                  in: query
                  description: Rows to skip before the first returned row.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 0
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: A page of retired Accounts.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountListResponse'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: rig_account.read
    /api/v1/accounts/{id}:
        get:
            tags:
                - Accounts
            summary: Fetch one Account by identifier.
            description: |-
                Fetch one Account by identifier.

                Requires the `rig_account.read` permission.
            operationId: getAccount
            parameters:
                - name: id
                  in: path
                  description: Identifier of the Account.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: The requested Account.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Account'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: rig_account.read
    /api/v1/rig-notification-devices:
        get:
            tags:
                - RigNotificationDevices
            summary: List RigNotificationDevices.
            description: |-
                List RigNotificationDevices.

                Requires the `rig_notification_device.read` permission.
            operationId: listRigNotificationDevices
            parameters:
                - name: limit
                  in: query
                  description: Maximum rows to return.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 50
                - name: offset
                  in: query
                  description: Rows to skip before the first returned row.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    default: 0
                - name: scope
                  in: query
                  description: 'How wide to read: own for the rignotificationdevices the caller created, which is the default, or all for every one in the tenant. Asking for all requires the rig_notification_device.read.all permission and is refused without it, rather than quietly answering with fewer rows.'
                  required: false
                  schema:
                    type: string
                    enum:
                        - own
                        - all
                    default: own
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "200":
                    description: A page of RigNotificationDevices.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RigNotificationDeviceListResponse'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: rig_notification_device.read
            x-rig-wide-permission: rig_notification_device.read.all
        post:
            tags:
                - RigNotificationDevices
            summary: Create a RigNotificationDevice.
            description: |-
                Create a RigNotificationDevice.

                Requires the `rig_notification_device.write` permission.
            operationId: createRigNotificationDevice
            parameters:
                - $ref: '#/components/parameters/ApiRevision'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                description: The fields a new RigNotificationDevice is created with. A field the database cannot supply for itself is required.
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RigNotificationDeviceCreateInput'
                required: true
            responses:
                "201":
                    description: The created RigNotificationDevice.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                        Idempotency-Replayed:
                            $ref: '#/components/headers/IdempotencyReplayed'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RigNotificationDevice'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: rig_notification_device.write
    /api/v1/rig-notification-devices/{id}:
        delete:
            tags:
                - RigNotificationDevices
            summary: Delete a RigNotificationDevice.
            description: |-
                Delete a RigNotificationDevice.

                Requires the `rig_notification_device.delete` permission.
            operationId: deleteRigNotificationDevice
            parameters:
                - name: id
                  in: path
                  description: Identifier of the RigNotificationDevice.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - $ref: '#/components/parameters/ApiRevision'
            responses:
                "204":
                    description: The RigNotificationDevice was deleted.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "429":
                    $ref: '#/components/responses/RateLimited'
                "500":
                    $ref: '#/components/responses/Internal'
            x-rig-permission: rig_notification_device.delete
