                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                description: 'The fields of a Todo to change. Every member is optional: one left out is left alone, and an explicit null clears it.'
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TodoUpdateInput'
                required: true
            responses:
                "200":
                    description: The updated Todo.
                    headers:
                        API-Revision:
                            $ref: '#/components/headers/ApiRevision'
