    responses:
        BadRequest:
            description: |-
                The request was malformed or a parameter could not be parsed.

                The body's `code` is `BadRequest`.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        Unauthorized:
            description: |-
                No valid session or API key was presented.

                The body's `code` is `Unauthorized`.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        Forbidden:
            description: |-
                The caller is known but not permitted to do this.

                The body's `code` is `Forbidden`.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        NotFound:
            description: |-
                No such resource, or it belongs to another tenant.

                The body's `code` is `NotFound`.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        Conflict:
            description: |-
                The request conflicts with the current state of the resource.

                The body's `code` is `Conflict`.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        TooLarge:
            description: |-
                The request body is larger than this endpoint accepts.

                The body's `code` is `TooLarge`.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        UnsupportedMediaType:
            description: |-
                The body's content type is not one this endpoint accepts.

                The body's `code` is `UnsupportedMediaType`.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        UnprocessableEntity:
            description: |-
                The request was well-formed but failed validation.

                The body's `code` is `UnprocessableEntity`.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        RateLimited:
            description: |-
                Too many requests. Retry after the interval in the Retry-After header.

                The body's `code` is `RateLimited`.
            headers:
                Retry-After:
                    $ref: '#/components/headers/RetryAfter'
                RateLimit-Limit:
                    $ref: '#/components/headers/RateLimitLimit'
                RateLimit-Remaining:
                    $ref: '#/components/headers/RateLimitRemaining'
                RateLimit-Reset:
                    $ref: '#/components/headers/RateLimitReset'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        Internal:
            description: |-
                Something went wrong on the server.

                The body's `code` is `Internal`.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
    parameters:
        ApiRevision:
            name: API-Revision
            in: header
            description: The API revision this client was built against. A server generated from an older document than the caller expects answers 426 rather than guessing.
            required: false
            schema:
                type: string
        IdempotencyKey:
            name: Idempotency-Key
            in: header
            description: A key of the caller's choosing, so a retried write happens once. Sending the same key with the same body replays the first answer and sets Idempotency-Replayed; with a different body it is refused with 422, and while the first is still in flight, with 409.
            required: false
            schema:
                type: string
    headers:
        ApiRevision:
            description: The revision this server was generated from.
            schema:
                type: string
        IdempotencyReplayed:
            description: Present and true when this answer is a replay of an earlier request carrying the same Idempotency-Key, rather than work done again.
            schema:
                type: boolean
        RateLimitLimit:
            description: Requests permitted in the current window.
            schema:
                type: integer
        RateLimitRemaining:
            description: Requests left in the current window.
            schema:
                type: integer
        RateLimitReset:
            description: Seconds until the current window resets.
            schema:
                type: integer
        RetryAfter:
            description: Seconds to wait before retrying.
            schema:
                type: integer
    securitySchemes:
        bearerAuth:
            type: http
            description: |-
                A credential in `Authorization: Bearer <token>`.

                Two kinds are accepted and are told apart by a prefix on the token itself. A session access token travels on every request and is good for 10m, renewed against the session endpoints before it expires. An API key does not expire: an integration key's scopes are its permissions outright, and a personal key carries what its owner carries and no more.

                The endpoints that issue and renew these are mounted under `/auth` and are not described in this document.
            scheme: bearer
            bearerFormat: opaque
security:
    - bearerAuth: []
tags:
    - name: Accounts
      description: One person inside one tenant. The person is the identity; this is who they are here.
    - name: RigNotificationDevices
      description: 'Where a push can reach somebody. Email is refused: the address is on the account already.'
    - name: RigNotificationRecipients
      description: 'One inbox line: a notification, an account, and whether it has been read.'
    - name: RigNotificationSettings
      description: 'What somebody wants on a channel, and when. Resolved in three steps: this kind, then this channel, then the project default.'
    - name: RigPresences
      description: Who is here and what they are looking at. One row per browser tab, rewritten every heartbeat and deleted once it is stale.
    - name: Todos
      description: One item on the board.
    - name: TodoAttachments
      description: A file attached to a todo.
